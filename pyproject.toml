[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-dashboard-voice-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "livekit-agents[openai,silero]>=1.6,<2",
  "livekit-plugins-deepgram>=1.2,<2",
  "livekit-plugins-elevenlabs>=1.2,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "structlog>=25.1,<26",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["mypy>=1.14", "pytest>=8.3", "pytest-asyncio>=0.25", "respx>=0.22", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
