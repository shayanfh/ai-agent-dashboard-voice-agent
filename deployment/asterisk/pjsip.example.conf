; Example only. For FreePBX use pjsip_custom.conf; never overwrite generated files.
[livekit]
type=endpoint
transport=transport-udp
context=from-livekit
disallow=all
allow=ulaw,alaw
aors=livekit

[livekit]
type=aor
contact=sip:YOUR_LIVEKIT_SIP_HOST:5060

[livekit]
type=identify
endpoint=livekit
match=LIVEKIT_SIP_IP

