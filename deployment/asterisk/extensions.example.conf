; Example only. Put custom FreePBX routing in extensions_custom.conf.
; Ensure direct_media=no on the PJSIP endpoints so audio remains recordable.

[ai-agent-livekit-headers]
exten => s,1,NoOp(Add correlation headers to the outbound LiveKit channel)
 same => n,Set(PJSIP_HEADER(add,X-Asterisk-LinkedID)=${ARG1})
 same => n,Return()

[from-internal-custom]
exten => 999,1,NoOp(Route restaurant call to LiveKit with MixMonitor)
 ; Keep this equal to the active Backend phone_number mapping (currently 1000).
 same => n,Set(AI_AGENT_LIVEKIT_NUMBER=1000)
 same => n,Set(__AST_RECORDING_ID=${FILTER(0-9A-Za-z_.-,${CHANNEL(linkedid)})})
 same => n,Set(AST_RECORDING_FILE=/var/spool/asterisk/monitor/ai-agent/${AST_RECORDING_ID}.wav)
 same => n,MixMonitor(${AST_RECORDING_FILE},b,i(AST_MIXMONITOR_ID),/usr/local/bin/upload-asterisk-recording.sh ${AST_RECORDING_FILE} ${AST_RECORDING_ID})
 same => n,Dial(PJSIP/${AI_AGENT_LIVEKIT_NUMBER}@livekit,60,b(ai-agent-livekit-headers^s^1(${AST_RECORDING_ID})))
 same => n,StopMixMonitor(${AST_MIXMONITOR_ID})
 same => n,Hangup()
